<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>F-Football</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="careerMenu">
  <div class="careerCard">
    <div class="careerTitle">F-FOOTBALL <span>CAREER MODE</span></div>
    <div id="careerTabs" class="careerTabs">
      <button data-tab="dashboard">DASHBOARD</button><button data-tab="training">TRAINING</button><button data-tab="transfers">TRANSFERS</button><button data-tab="fixtures">FIXTURES</button><button data-tab="table">TABLE</button>
    </div>
    <div id="careerContent"></div>
    <div class="careerActions">
      <button id="careerMatch">PLAY NEXT MATCH</button>
      <button id="careerSave">SAVE</button>
      <button id="careerReset">NEW CAREER</button>
    </div>
  </div>
</div>
<div id="hud">
  <div class="brand">F-FOOTBALL <small>11v11</small></div>
  <div class="match">
    <span id="score">0 - 0</span>
    <span id="timer">03:00</span>
  </div>
  <div id="status">KICK OFF</div>
</div>

<div id="message"></div>

<div id="controls">
  <div class="stick">
    <button id="up">▲</button>
    <div><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div>
  </div>
  <div class="actions">
    <button id="pass">PASS</button>
    <button id="shoot">SHOOT</button>
    <button id="tackle">TACKLE</button>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
